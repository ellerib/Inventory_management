<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .contain{
            display: flex;
            margin-left: 50px;
            padding-left: 40px;
            border: 7px red solid;
            border-radius: 20px;
        }

        .ordered{
            margin-left: 100px;
        }

        table, th,td{
            border: solid 2px black;
            border-collapse: collapse;
        }

    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Practice </title>
</head>
<body>
    
    <div class="contain">
        <div class="unorder">
            <h1> Things  </h1>
            <ul>  
                <li> Pen </li>
                <li> Pencil </li>
                <li> Eraser </li> 
            </ul>
        </div>
        
        <div class="ordered">
            <h1> Animals </h1>
            <ol>
                <li> Zebra </li>
                <li> Dog </li>
                <li> Cat </li>
            </ol>
        </div>
    </div>

    <div class="contain2">
        <table>
            <tr>
                <th> Name </th>
                <th> Course </th>
                <th> School </th>
            </tr>

            <tr>
                <td> Jubs </td>
                <td> BSIS </td>
                <td> CTU </td>
            </tr>

            <tr>
                <td> Clems </td>
                <td> BSIT </td>
                <td> ACT </td>
            </tr>

        </table>

        <form>
            <label for="username"> username </label>
            <input type="text" id="username" name="username">
            <br>

            <label for="password"> Password </label>
            <input type="password" id="password" name="password">
            <br>
            
            <button class="login"> Login </button>
            <a href="#"> Forgot Password? </a>
            
            <br>
            <label> Date </label>
            <input type="date" id="date" name="date">

        </form>

    </div>
    
    

</body>
</html>
